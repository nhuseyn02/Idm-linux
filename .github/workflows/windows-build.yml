name: windows-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python entry point
        shell: pwsh
        run: python -c "import ast; ast.parse(open('helper/helper.py',encoding='utf-8').read()); print('helper.py OK')"

      - name: Install build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements.txt
          pip install pyinstaller

      - name: Download and verify tools
        shell: pwsh
        run: python build/download_tools.py

      - name: Build helper (PyInstaller onedir)
        shell: pwsh
        run: pyinstaller build/idm-helper.spec --noconfirm --clean

      - name: Sanity-check frozen helper
        shell: pwsh
        run: |
          Test-Path "dist/idm-helper.exe"
          # --doctor returns quickly and prints a report; do not fail the build on its exit code here
          & "dist/idm-helper.exe" --doctor

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v) { $v = "0.0.0" }
          "ver=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\idm-setup.iss" "/DAppVer=${{ steps.ver.outputs.ver }}"

      - name: Checksums
        shell: pwsh
        run: |
          $f = "dist/idm-setup-${{ steps.ver.outputs.ver }}.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  $(Split-Path $f -Leaf)" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/idm-setup-${{ steps.ver.outputs.ver }}.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
